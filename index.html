<style>
  /* Layout: one printed-invitation look. A tall paper card whose watercolor flowers sway gently.
     The card opens on an initials cover; tapping it reveals the invitation text, then the countdown panel below. */
  :root {
    --ground: #ebe6ef;      /* soft lilac-grey page ground */
    --paper: #f9f8f3;       /* invitation paper */
    --ink: #1f2d26;         /* deep garden green-black */
    --ink-soft: #5b6a62;    /* muted labels */
    --gold: #b08d57;        /* monogram and hairlines */
    --tile-lilac: #e3dbf1;
    --tile-blush: #f8dce4;
    --tile-butter: #faefc6;
    --tile-sky: #d9e7f6;
    --display: "Cormorant Garamond", "Cormorant", Georgia, "Times New Roman", serif;
    --utility: "Jost", "Helvetica Neue", Arial, sans-serif;
    color-scheme: light;
  }
  body {
    background: var(--ground);
    color: var(--ink);
    font-family: var(--display);
    padding-block: 28px 40px;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
  }
  .page { width: 100%; max-width: 600px; margin: 0 auto; display: flex; flex-direction: column; gap: 20px; }

  /* ---------- Card and moving flowers ---------- */
  .card {
    container-type: inline-size;
    position: relative;
    width: 100%;
    aspect-ratio: 853 / 1280;
    background: var(--paper);
    border-radius: 4px;
    overflow: hidden;
    box-shadow: 0 1px 2px rgba(60, 40, 80, .10), 0 18px 40px -12px rgba(60, 40, 80, .28);
  }
  .flowers { position: absolute; inset: 0; pointer-events: none; }
  .fl {
    position: absolute;
    display: block;
    height: auto;
    user-select: none;
    will-change: transform;
    animation: sway var(--dur) ease-in-out var(--delay) infinite alternate;
  }
  @keyframes sway {
    from { transform: rotate(calc(var(--a) * -1)) translateY(calc(var(--b) * -.5)); }
    to   { transform: rotate(var(--a)) translateY(var(--b)); }
  }

  /* ---------- Cover (initials) ---------- */
  .cover, .card-text {
    position: absolute;
    z-index: 1;
    display: flex; flex-direction: column; align-items: center;
    text-align: center;
  }
  .cover {
    left: 22%; right: 22%; top: 30%; bottom: 30%;
    justify-content: center; gap: 9cqw;
    cursor: pointer;
    transition: opacity .6s ease, transform .6s ease, visibility 0s linear .6s;
  }
  .card.is-open .cover { opacity: 0; visibility: hidden; transform: scale(.96); }
  .cover-mono { display: flex; align-items: center; gap: 3.6cqw; color: var(--gold); }
  .cover-mono i { display: block; width: 6cqw; height: 1px; background: var(--gold); }
  .cover-mono b {
    display: block;
    font-size: max(66px, 24cqw);
    font-weight: 500;
    line-height: 1;
    white-space: nowrap;
  }
  .cover-mono b span:last-child { display: inline-block; margin-left: -.3em; transform: translateY(.14em); }
  .open-btn {
    appearance: none;
    min-height: 44px;
    padding: 0 24px;
    border: 1px solid var(--gold);
    border-radius: 999px;
    background: transparent;
    color: var(--ink);
    font-family: var(--utility);
    font-size: 12px;
    font-weight: 500;
    letter-spacing: .18em;
    text-indent: .18em;
    text-transform: uppercase;
    cursor: pointer;
    transition: background .25s ease, color .25s ease;
  }
  .open-btn:hover { background: var(--ink); border-color: var(--ink); color: var(--paper); }
  .open-btn:focus-visible { outline: 3px solid var(--gold); outline-offset: 3px; }

  /* ---------- Invitation text ---------- */
  .card-text {
    left: 24.5%; right: 24.5%;
    top: 20.5%; bottom: 23.5%;
    justify-content: space-between;
    opacity: 0; visibility: hidden;
    transition: opacity .9s ease .35s, visibility 0s linear;
  }
  .card.is-open .card-text { opacity: 1; visibility: visible; }
  .card-text:focus { outline: none; }
  .eyebrow {
    margin: 0;
    font-size: max(11px, 2.25cqw);
    font-weight: 500;
    letter-spacing: .2em;
    text-transform: uppercase;
    line-height: 1.7;
    text-wrap: balance;
  }
  .names { margin: 0; font: inherit; display: flex; flex-direction: column; align-items: center; gap: 3.2cqw; }
  .name {
    font-size: max(27px, 5.8cqw);
    font-weight: 500;
    letter-spacing: .14em;
    text-indent: .14em;
    text-transform: uppercase;
    line-height: 1;
  }
  .and {
    font-size: max(11px, 2.2cqw);
    font-weight: 500;
    letter-spacing: .24em;
    text-indent: .24em;
    text-transform: uppercase;
  }
  .details { display: flex; flex-direction: column; align-items: center; gap: 2.6cqw; }
  .when {
    display: flex; flex-direction: column; align-items: center; gap: 8px;
    font-size: max(12px, 2.5cqw);
    font-weight: 500;
    letter-spacing: .14em;
    text-transform: uppercase;
    white-space: nowrap;
  }
  .when .time { order: 2; }
  .when .date { order: 1; }
  .when .rule { order: 1; width: 22px; height: 1px; background: var(--gold); }
  .place { margin: 0; font-size: max(19px, 3.4cqw); font-weight: 500; letter-spacing: .04em; }
  .mono { display: flex; align-items: center; gap: 3.6cqw; color: var(--gold); }
  .mono i { display: block; width: 8cqw; height: 1px; background: var(--gold); }
  .mono b {
    display: block;
    font-size: max(32px, 7.4cqw);
    font-weight: 500;
    line-height: 1;
    white-space: nowrap;
  }
  .mono b span:last-child { display: inline-block; margin-left: -.3em; transform: translateY(.14em); }

  @container (min-width: 470px) {
    .when { flex-direction: row; gap: 2.4cqw; }
    .when .time { order: 1; }
    .when .date { order: 3; }
    .when .rule { order: 2; width: 1px; height: 1.5em; }
  }

  /* ---------- Countdown ---------- */
  .panel {
    background: var(--paper);
    border-radius: 4px;
    padding: 28px max(18px, 5%) 26px;
    box-shadow: 0 1px 2px rgba(60, 40, 80, .10), 0 18px 40px -16px rgba(60, 40, 80, .24);
    display: flex; flex-direction: column; align-items: center; gap: 20px;
    text-align: center;
  }
  .panel[hidden], .done[hidden], .tiles[hidden] { display: none; }
  .panel.rise { animation: rise .8s ease both; }
  @keyframes rise { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
  .panel h2 {
    margin: 0;
    font-size: 15px;
    font-family: var(--utility);
    font-weight: 500;
    letter-spacing: .22em;
    text-indent: .22em;
    text-transform: uppercase;
    color: var(--ink-soft);
  }
  .tiles { width: 100%; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; }
  .tile {
    min-width: 0;
    padding: 16px 4px 12px;
    border-radius: 14px;
    display: flex; flex-direction: column; align-items: center; gap: 6px;
  }
  .tile:nth-child(1) { background: var(--tile-lilac); }
  .tile:nth-child(2) { background: var(--tile-blush); }
  .tile:nth-child(3) { background: var(--tile-butter); }
  .tile:nth-child(4) { background: var(--tile-sky); }
  .num { font-size: clamp(34px, 11vw, 54px); font-weight: 500; line-height: 1; font-variant-numeric: tabular-nums; }
  .unit {
    font-family: var(--utility);
    font-size: 11px;
    font-weight: 500;
    letter-spacing: .16em;
    text-indent: .16em;
    text-transform: uppercase;
    color: var(--ink-soft);
  }
  .done { margin: 0; font-size: 26px; font-weight: 500; line-height: 1.3; text-wrap: balance; }
  .when-line { margin: 0; font-size: 20px; font-weight: 500; line-height: 1.4; text-wrap: balance; }
  .when-line small { display: block; font-family: var(--utility); font-size: 12px; letter-spacing: .12em; text-transform: uppercase; color: var(--ink-soft); margin-top: 4px; }
  .map {
    display: inline-flex; align-items: center; justify-content: center;
    min-height: 46px; padding: 0 26px;
    border-radius: 999px;
    background: var(--ink); color: var(--paper);
    font-family: var(--utility); font-size: 13px; font-weight: 500;
    letter-spacing: .14em; text-transform: uppercase; text-decoration: none;
  }
  .map:hover { background: #2f443a; }
  .map:focus-visible { outline: 3px solid var(--gold); outline-offset: 3px; }

  /* ---------- Moving text ---------- */
  .card.is-open .rv {
    animation: textIn 1s cubic-bezier(.2, .7, .2, 1) calc(.55s + var(--i) * .16s) both,
               drift 7s ease-in-out calc(1.6s + var(--i) * .4s) infinite alternate both;
  }
  .card.is-open .name.rv { animation-name: nameIn, drift; }
  @keyframes textIn { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
  @keyframes nameIn {
    from { opacity: 0; letter-spacing: .26em; transform: translateY(14px); }
    to   { opacity: 1; letter-spacing: .14em; transform: none; }
  }
  @keyframes drift { from { translate: 0 -1.5px; } to { translate: 0 1.5px; } }

  .cover-mono b span, .mono b span { display: inline-block; }
  .cover-mono b span:first-child, .mono b span:first-child { animation: initial-float 4.5s ease-in-out infinite alternate; }
  .cover-mono b span:last-child, .mono b span:last-child { animation: initial-float 4.5s ease-in-out infinite alternate-reverse; }
  @keyframes initial-float { from { translate: 0 -.04em; } to { translate: 0 .04em; } }
  .open-btn { animation: ring 2.8s ease-out infinite; }
  @keyframes ring {
    0% { box-shadow: 0 0 0 0 rgba(176, 141, 87, .4); }
    70%, 100% { box-shadow: 0 0 0 14px rgba(176, 141, 87, 0); }
  }

  @media (prefers-reduced-motion: reduce) {
    .rv, .cover-mono b span, .mono b span, .open-btn { animation: none !important; }
    .fl { animation: none; }
    .panel.rise { animation: none; }
    .cover, .card-text { transition-duration: .01s; transition-delay: 0s; }
  }
</style>

      <div class="cover-mono" aria-hidden="true"><i></i><b><span>Y</span><span>R</span></b><i></i></div>
      <button class="open-btn" id="open" type="button" aria-label="Open the invitation from Youssef and Radwa">Open invitation</button>
    </div>

    <div class="card-text" id="text" tabindex="-1" inert aria-hidden="true">
      <p class="eyebrow rv" style="--i:0">You are invited to the engagement of</p>
      <h1 class="names">
        <span class="name rv" style="--i:1">Youssef</span>
        <span class="and rv" style="--i:2">and</span>
        <span class="name rv" style="--i:3">Radwa</span>
      </h1>
      <div class="details">
        <div class="when rv" style="--i:4">
          <span class="time">7 o&rsquo;clock</span>
          <span class="rule"></span>
          <span class="date">November 20, 2026</span>
        </div>
        <p class="place rv" style="--i:5">Obour</p>
      </div>
      <div class="mono rv" style="--i:6" aria-hidden="true"><i></i><b><span>Y</span><span>R</span></b><i></i></div>
    </div>
  </section>

  <section class="panel" id="panel" aria-label="Countdown to the engagement" hidden>
    <h2 id="cd-title">Counting down</h2>
    <div class="tiles" id="tiles" role="timer" aria-labelledby="cd-title">
      <div class="tile"><span class="num" id="d">00</span><span class="unit">Days</span></div>
      <div class="tile"><span class="num" id="h">00</span><span class="unit">Hours</span></div>
      <div class="tile"><span class="num" id="m">00</span><span class="unit">Minutes</span></div>
      <div class="tile"><span class="num" id="s">00</span><span class="unit">Seconds</span></div>
    </div>
    <p class="done" id="done" hidden></p>
    <p class="when-line">Friday, November 20, 2026 at 7:00 PM<small>Obour &middot; Egypt time</small></p>
    <a class="map" href="https://www.google.com/maps?q=30.223840713500977,31.445064544677734&z=17&hl=en" target="_blank" rel="noopener noreferrer">View location on map</a>
  </section>
</main>

<script>
  (function () {
    /* Cover -> invitation */
    var card = document.getElementById("card");
    var cover = document.getElementById("cover");
    var text = document.getElementById("text");
    var panel = document.getElementById("panel");
    var opened = false;
    function openInvitation() {
      if (opened) return;
      opened = true;
      card.classList.add("is-open");
      cover.inert = true;
      cover.setAttribute("aria-hidden", "true");
      text.inert = false;
      text.removeAttribute("aria-hidden");
      panel.hidden = false;
      panel.classList.add("rise");
      try { text.focus({ preventScroll: true }); } catch (e) {}
    }
    cover.addEventListener("click", openInvitation);

    /* Countdown to 7:00 PM, November 20, 2026, Egypt time (UTC+2) */
    var target = new Date("2026-11-20T19:00:00+02:00").getTime();
    var els = { d: document.getElementById("d"), h: document.getElementById("h"), m: document.getElementById("m"), s: document.getElementById("s") };
    var tiles = document.getElementById("tiles");
    var title = document.getElementById("cd-title");
    var done = document.getElementById("done");
    function pad(n) { return n < 10 ? "0" + n : String(n); }
    function tick() {
      var diff = target - Date.now();
      if (diff <= 0) {
        tiles.hidden = true;
        done.hidden = false;
        var over = Date.now() - target > 12 * 3600 * 1000;
        title.textContent = over ? "With love" : "Tonight";
        done.textContent = over ? "Thank you for celebrating with Youssef and Radwa." : "The celebration has begun.";
        return;
      }
      var total = Math.floor(diff / 1000);
      els.d.textContent = pad(Math.floor(total / 86400));
      els.h.textContent = pad(Math.floor((total % 86400) / 3600));
      els.m.textContent = pad(Math.floor((total % 3600) / 60));
      els.s.textContent = pad(total % 60);
    }
    tick();
    setInterval(tick, 1000);
  })();
</script>

</body>
</html>
